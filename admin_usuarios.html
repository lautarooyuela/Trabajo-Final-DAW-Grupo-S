<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Usuarios - IDW S.A.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>

<header>
    <nav class="navbar navbar-expand-md navbar-dark bg-primary" style="height: 70px;">
        <div class="container">
            <a href="index.html" class="navbar-brand d-flex align-items-center">
                <span class="fs-4 align-middle">IDW S.A. - Admin</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAdmin"
                aria-controls="navbarNavAdmin" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNavAdmin">
                <ul class="navbar-nav gap-3">
                    <li class="nav-item">
                        <a class="nav-link fs-5 px-2" href="index.html"><i class="fas fa-home me-1"></i>Inicio Sitio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fs-5 px-2" href="admin_salones.html"><i class="fas fa-person-booth me-1"></i>Administrar Salones</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fs-5 px-2" href="login.html" onclick="sessionStorage.removeItem('accessToken');">
                            <i class="fas fa-sign-out-alt me-1"></i>Cerrar Sesión
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<main class="container mt-4">
    <h2 class="mb-4 text-center">Lista de Usuarios Registrados</h2>
    <div class="table-responsive">
        <table id="tablaUsuarios" class="table table-bordered table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Usuario</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</main>

<footer class="container mt-5 py-4 border-top">
    <div class="text-center text-muted">
        <p class="mb-0">©IDW S.A - Todos los derechos reservados 2025</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        if (!sessionStorage.getItem("accessToken")) {
            window.location.href = "login.html";
            return;
        }

        const tablaUsuariosBody = document.getElementById("tablaUsuarios").querySelector("tbody");

        fetch('https://dummyjson.com/users')
            .then(res => res.json())
            .then(data => {
                tablaUsuariosBody.innerHTML = "";
                data.users.forEach(user => {
                    const fila = tablaUsuariosBody.insertRow();
                    fila.innerHTML = `
                        <td>${user.id}</td>
                        <td>${user.firstName}</td>
                        <td>${user.lastName}</td>
                        <td>${user.username}</td>
                        <td>${user.email}</td>
                    `;
                });
            })
            .catch(error => {
                tablaUsuariosBody.innerHTML = '<tr><td colspan="5" class="text-center">Error al cargar los datos de usuarios.</td></tr>';
            });
    });
</script>

</body>
</html>
