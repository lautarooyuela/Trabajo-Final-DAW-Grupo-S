<!DOCTYPE html>

<body>

<header>

        <li><a href="institucional.html">Informacion institucional</a></li>
        <li><a href="contacto.html" class="activo">Contacto</a></li>
    </ul>
</header>

<main>
    <h2>Contacto</h2>
    <p>¿Querés hacer un pedido o tenés alguna consulta? Completá el siguiente formulario y te responderemos a la brevedad.</p>

    <form action="#" method="post">
        <label for="nombre">Nombre <span class="requerido">*</span></label>
        <input type="text" id="nombre" name="nombre" required aria-required="true" placeholder="Escribí tu nombre completo">

        <label for="email">Correo electrónico <span class="requerido">*</span></label>
        <input type="email" id="email" name="email" required aria-required="true" placeholder="ejemplo@correo.com">

        <label for="mensaje">Mensaje <span class="requerido">*</span></label>
        <textarea id="mensaje" name="mensaje" rows="5" required aria-required="true" placeholder="Contanos qué necesitás o qué querés pedir..."></textarea>

        <button type="submit">Enviar mensaje</button>
    </form>
</main>

<footer>
    <ul>
        <li><a href="#">Facebook</a></li>

        <li><a href="#">WhatsApp</a></li>
    </ul>

</footer>

</body>
</html>
