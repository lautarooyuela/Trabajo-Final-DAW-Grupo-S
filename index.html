<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login con API</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <div class="main-container">

        <div id="welcome-screen" class="form-container hidden">
            <h1 id="welcome-message"></h1>
            <p>Has iniciado sesión correctamente usando la API.</p>
            <a href="admin.html" class="admin-link">Ir a Administración (Protegido)</a>
            <button id="logout-button">Cerrar Sesión</button>
        </div>

        <div id="auth-container">
            <div id="login-container" class="form-container">
                <form id="login-form">
                    <h1>Iniciar Sesión</h1>
                    <p class="info">Usa un usuario de <a href="https://dummyjson.com/users" target="_blank">DummyJSON</a></p>
                    <div class="input-group">
                        <label for="login-username">Usuario </label>
                        <input type="text" id="login-username" name="username" required value="kminchelle">
                    </div>
                    <div class="input-group">
                        <label for="login-password">Contraseña </label>
                        <input type="password" id="login-password" name="password" required value="0lelplR">
                    </div>
                    <button type="submit">Ingresar</button>
                    <p id="login-error" class="error-message"></p>
                </form>
            </div>
        </div>
    </div>

    <script src="usuario.js"></script>
</body>
</html>
