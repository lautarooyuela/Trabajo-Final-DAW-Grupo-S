<<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Salón - IDW S.A.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="container mt-5">
    <h2>Editar Salón</h2>
    <form id="formulario-editar-salon">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre:</label>
            <input type="text" class="form-control" id="nombre" name="nombre" required>
        </div>
        <div class="mb-3">
            <label for="direccion" class="form-label">Dirección:</label>
            <input type="text" class="form-control" id="direccion" name="direccion" required>
        </div>
        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción:</label>
            <textarea class="form-control" id="descripcion" name="descripcion" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label for="mapa" class="form-label">URL del Mapa:</label>
            <input type="url" class="form-control" id="mapa" name="mapa">
        </div>
        <div class="mb-3">
            <label for="imagen" class="form-label">URL de la Imagen:</label>
            <input type="url" class="form-control" id="imagen" name="imagen">
        </div>
        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        <a href="index.html" class="btn btn-secondary ms-2">Cancelar</a>
    </form>

    <script type="module">
        import { obtenerSalones, guardarSalones } from './accionessalon.js';

        document.addEventListener('DOMContentLoaded', function() {
            const formulario = document.getElementById('formulario-editar-salon');
            const nombreInput = document.getElementById('nombre');
            const direccionInput = document.getElementById('direccion');
            const descripcionTextarea = document.getElementById('descripcion');
            const mapaInput = document.getElementById('mapa');
            const imagenInput = document.getElementById('imagen');

            
            const urlParams = new URLSearchParams(window.location.search);
            const salonId = parseInt(urlParams.get('id'));

            if (salonId) {
                const salones = obtenerSalones();
                const salonAEditar = salones.find(salon => salon.id === salonId);

                if (salonAEditar) {
                    nombreInput.value = salonAEditar.nombre;
                    direccionInput.value = salonAEditar.direccion;
                    descripcionTextarea.value = salonAEditar.descripcion || '';
                    mapaInput.value = salonAEditar.mapa || '';
                    imagenInput.value = salonAEditar.imagen || '';
                } else {
                    alert('Salón no encontrado.');
                    window.location.href = 'index.html';
                }
            } else {
                alert('ID de salón no válido.');
                window.location.href = 'index.html';
            }

            formulario.addEventListener('submit', function(event) {
                event.preventDefault();

                const salones = obtenerSalones();
                const indiceSalon = salones.findIndex(salon => salon.id === salonId);

                if (indiceSalon !== -1) {
                    salones[indiceSalon].nombre = nombreInput.value;
                    salones[indiceSalon].direccion = direccionInput.value;
                    salones[indiceSalon].descripcion = descripcionTextarea.value;
                    salones[indiceSalon].mapa = mapaInput.value;
                    salones[indiceSalon].imagen = imagenInput.value;

                    guardarSalones(salones);
                    alert('Salón guardado con éxito.');
                    window.location.href = 'index.html';
                } else {
                    alert('Error al guardar el salón.');
                }
            });
        });
    </script>
</body>
</html>>
